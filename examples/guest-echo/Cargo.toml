[package]
name = "guest-echo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

# 独立packageであることを宣言し、上位のworkspace探索をここで止める。
[workspace]

[dependencies]
minios-abi = { git = "https://github.com/kunihiko-t/minios.git", tag = "minios-abi-v0.2.0" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
