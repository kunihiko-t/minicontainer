name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-28
        with:
          toolchain: 1.98.0
          targets: riscv64gc-unknown-none-elf
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - run: cargo xtask setup
      - run: cargo xtask check
      - name: Smoke-test minictr doctor
        run: |
          set -eu
          mkdir -p /tmp/doctor-smoke/store
          printf 'KERNEL' > /tmp/doctor-smoke/kernel
          ./target/debug/minictr doctor --store /tmp/doctor-smoke/store --kernel /tmp/doctor-smoke/kernel > /tmp/doctor-smoke/report.txt
          grep -q "summary: passed 3/3 checks" /tmp/doctor-smoke/report.txt
          if ./target/debug/minictr doctor --store /tmp/doctor-smoke/missing --kernel /tmp/doctor-smoke/missing > /tmp/doctor-smoke/fail.txt 2>&1; then
            echo "doctor must exit 1 for missing paths"
            exit 1
          fi
          grep -q "store: fail" /tmp/doctor-smoke/fail.txt
          test ! -e /tmp/doctor-smoke/missing
      - name: Smoke-test release archive
        run: |
          set -eu
          cargo build -p minictr --release --locked
          git clone https://github.com/kunihiko-t/minios.git /tmp/release-smoke/minios
          git -C /tmp/release-smoke/minios checkout --detach 9be99255a59d58d19db25b835af0e28a8d2a4036
          cargo build --manifest-path /tmp/release-smoke/minios/Cargo.toml --target-dir /tmp/release-smoke/minios/target -p minios-kernel --bin minios-kernel --target riscv64gc-unknown-none-elf --release --locked
          cargo xtask dist --target x86_64-unknown-linux-gnu --minictr target/release/minictr --kernel /tmp/release-smoke/minios/target/riscv64gc-unknown-none-elf/release/minios-kernel --output /tmp/release-smoke/dist
          (cd /tmp/release-smoke/dist && sha256sum -c ./*.sha256)
          mkdir -p /tmp/release-smoke/extract
          tar xzf /tmp/release-smoke/dist/*.tar.gz -C /tmp/release-smoke/extract
          SMOKE_DIR=$(echo /tmp/release-smoke/extract/minicontainer-*-x86_64-unknown-linux-gnu)
          (cd "$SMOKE_DIR" && sha256sum -c SHA256SUMS)
          test -x "$SMOKE_DIR/minictr"
          "$SMOKE_DIR/minictr" --version | grep -q "minictr 0.1.0"
          "$SMOKE_DIR/minictr" image build --store /tmp/release-smoke/store hello target/guest-hello/riscv64gc-unknown-none-elf/release/guest-hello
          set +e
          "$SMOKE_DIR/minictr" run --store /tmp/release-smoke/store --kernel "$SMOKE_DIR/kernel/minios.bin" hello > /tmp/release-smoke/guest.txt 2> /tmp/release-smoke/guest.err
          status=$?
          set -e
          test "$status" -eq 42
          grep -q "hello from guest" /tmp/release-smoke/guest.txt
      - name: Install pinned ORAS
        run: |
          set -eu
          mkdir -p /tmp/oras/bin
          curl -sSL -o /tmp/oras/oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
          echo "f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454  /tmp/oras/oras.tar.gz" | sha256sum -c -
          tar xzf /tmp/oras/oras.tar.gz -C /tmp/oras/bin oras
          /tmp/oras/bin/oras version | grep -q "1\.3\.4"
      - name: Install Skopeo
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q skopeo
          skopeo --version
      - name: Verify OCI interop offline
        run: |
          set -eu
          export PATH="/tmp/oras/bin:$PATH"
          (cd tests/fixtures/oci-interop && sha256sum -c SHA256SUMS)
          MINICTR=target/debug/minictr
          "$MINICTR" image import-oci --store /tmp/oci-interop/store oras tests/fixtures/oci-interop/oras-copy
          "$MINICTR" image import-oci --store /tmp/oci-interop/store skopeo tests/fixtures/oci-interop/skopeo-copy
          "$MINICTR" image inspect --store /tmp/oci-interop/store oras | grep -q "digest: sha256:f8200f06e25dcb0f36a744b780c0fa1b40030c9a6bb9786b122cad44cad221ff"
          "$MINICTR" image inspect --store /tmp/oci-interop/store skopeo | grep -q "digest: sha256:f8200f06e25dcb0f36a744b780c0fa1b40030c9a6bb9786b122cad44cad221ff"
          "$MINICTR" image export-oci --store /tmp/oci-interop/store oras --output /tmp/oci-interop/re-export
          cmp /tmp/oci-interop/re-export/blobs/sha256/6c710671215c4929fa600956d236ae82df1f3a9f05f0b125c3fb0feed9096136 tests/fixtures/oci-interop/oras-copy/blobs/sha256/6c710671215c4929fa600956d236ae82df1f3a9f05f0b125c3fb0feed9096136
          "$MINICTR" image build --store /tmp/oci-interop/store guest target/guest-hello/riscv64gc-unknown-none-elf/release/guest-hello
          "$MINICTR" image export-oci --store /tmp/oci-interop/store guest --output /tmp/oci-interop/guest-layout
          MD=$(grep -o 'sha256:[0-9a-f]\{64\}' /tmp/oci-interop/guest-layout/index.json | head -n 1)
          oras cp --from-oci-layout /tmp/oci-interop/guest-layout@"$MD" --to-oci-layout /tmp/oci-interop/guest-oras:guest
          skopeo copy oci:/tmp/oci-interop/guest-layout oci:/tmp/oci-interop/guest-skopeo
          "$MINICTR" image import-oci --store /tmp/oci-interop/store guest-oras /tmp/oci-interop/guest-oras
          "$MINICTR" image import-oci --store /tmp/oci-interop/store guest-skopeo /tmp/oci-interop/guest-skopeo
          KERNEL=target/e2e/minios/target/riscv64gc-unknown-none-elf/debug/minios-kernel
          set +e
          "$MINICTR" run --store /tmp/oci-interop/store --kernel "$KERNEL" guest-oras > /tmp/oci-interop/guest.txt 2> /tmp/oci-interop/guest.err
          status=$?
          set -e
          test "$status" -eq 42
          grep -q "hello from guest" /tmp/oci-interop/guest.txt
          set +e
          "$MINICTR" run --store /tmp/oci-interop/store --kernel "$KERNEL" guest-skopeo > /tmp/oci-interop/guest2.txt 2> /tmp/oci-interop/guest2.err
          status=$?
          set -e
          test "$status" -eq 42
          grep -q "hello from guest" /tmp/oci-interop/guest2.txt
  check-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-28
        with:
          toolchain: 1.98.0
          targets: riscv64gc-unknown-none-elf
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - run: cargo xtask check-host
      - name: Smoke-test minictr doctor failures
        run: |
          set -eu
          mkdir -p /tmp/doctor-smoke/store
          printf 'KERNEL' > /tmp/doctor-smoke/kernel
          if ./target/debug/minictr doctor --store /tmp/doctor-smoke/missing --kernel /tmp/doctor-smoke/kernel > /tmp/doctor-smoke/fail.txt 2>&1; then
            echo "doctor must exit 1 for a missing store"
            exit 1
          fi
          grep -q "store: fail" /tmp/doctor-smoke/fail.txt
          grep -q "kernel: ok" /tmp/doctor-smoke/fail.txt
          test ! -e /tmp/doctor-smoke/missing
