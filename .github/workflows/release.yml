name: release

on:
  push:
    tags:
      - v0.1.0

permissions:
  contents: read

jobs:
  build-archives:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-28
        with:
          toolchain: 1.98.0
          targets: riscv64gc-unknown-none-elf
      - name: Build minictr
        run: cargo build -p minictr --release --locked
      - name: Build miniOS kernel
        run: |
          set -eu
          git clone https://github.com/kunihiko-t/minios.git minios
          git -C minios checkout --detach 9be99255a59d58d19db25b835af0e28a8d2a4036
          cargo build --manifest-path minios/Cargo.toml --target-dir minios/target -p minios-kernel --bin minios-kernel --target riscv64gc-unknown-none-elf --release --locked
      - name: Build distribution archive
        run: cargo xtask dist --target ${{ matrix.target }} --minictr target/release/minictr --kernel minios/target/riscv64gc-unknown-none-elf/release/minios-kernel --output dist
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/minicontainer-0.1.0-${{ matrix.target }}.tar.gz
          archive: false
      - name: Upload checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/minicontainer-0.1.0-${{ matrix.target }}.tar.gz.sha256
          archive: false
