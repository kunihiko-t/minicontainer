name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-archives:
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-28
        with:
          toolchain: 1.98.0
          targets: riscv64gc-unknown-none-elf
      - name: Build minictr
        run: cargo build -p minictr --release --locked
      - name: Build miniOS kernel
        run: |
          set -eu
          git clone https://github.com/kunihiko-t/minios.git minios
          git -C minios checkout --detach 4865f9be97a6cdcd77c71e36b1ba426b49bd73d7
          cargo build --manifest-path minios/Cargo.toml --target-dir minios/target -p minios-kernel --bin minios-kernel --target riscv64gc-unknown-none-elf --release --locked
      - name: Build distribution archive
        run: cargo xtask dist --target ${{ matrix.target }} --minictr target/release/minictr --kernel minios/target/riscv64gc-unknown-none-elf/release/minios-kernel --version ${{ github.ref_name }} --output dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/minicontainer-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dist/minicontainer-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minicontainer-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/minicontainer-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          archive: false
      - name: Upload checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minicontainer-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/minicontainer-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          archive: false

  publish-release:
    needs: build-archives
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${{ github.ref_name }}"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          MiniContainer $VERSION distribution archives.

          Built from commit ${{ github.sha }} by the release workflow.
          Verify the checksum, then the build provenance:

              sha256sum -c 'minicontainer-$VERSION-x86_64-unknown-linux-gnu.tar.gz.sha256'
              gh attestation verify 'minicontainer-$VERSION-x86_64-unknown-linux-gnu.tar.gz' --owner kunihiko-t
          EOF
          gh release create "$VERSION" --repo "${{ github.repository }}" \
            --title "MiniContainer $VERSION" --notes-file "$NOTES" \
            dist/*/*.tar.gz dist/*/*.tar.gz.sha256
